name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      - name: Restore signing keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -n "$ANDROID_DEBUG_KEYSTORE" ]; then
            echo "$ANDROID_DEBUG_KEYSTORE" | base64 -d > "$HOME/.android/debug.keystore"
          fi
        env:
          ANDROID_DEBUG_KEYSTORE: ${{ secrets.ANDROID_DEBUG_KEYSTORE }}

      - name: Compute versionCode
        id: vc
        run: echo "versionCode=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Add Android platform
        run: |
          npx cap add android
          sed -i "s/versionCode 1$/versionCode ${{ steps.vc.outputs.versionCode }}/" android/app/build.gradle

      - name: Copy web assets into native project
        run: npx cap copy android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: lifelog-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
